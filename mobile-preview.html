<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>周思慧作品集 · 手机端预览</title>
  <style>
    :root{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#efefef;background:#1b1b1b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 5%,#333 0,#1b1b1b 45%);display:flex;flex-direction:column;align-items:center;padding:18px 20px 28px}
    .toolbar{width:min(720px,100%);display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px;font-size:13px;color:#bdbdbd}
    .toolbar strong{color:#fff;font-weight:500}.sizes{display:flex;gap:7px}.sizes button{border:1px solid #555;border-radius:999px;background:#282828;color:#ddd;padding:6px 12px;cursor:pointer}.sizes button.active{background:#ff2f2f;border-color:#ff2f2f;color:#fff}
    .device{width:414px;max-width:100%;padding:11px;background:linear-gradient(145deg,#494949,#111);border:1px solid #555;border-radius:42px;box-shadow:0 30px 80px #0008;transition:width .35s cubic-bezier(.16,1,.3,1)}
    .screen{position:relative;height:calc(100vh - 112px);min-height:560px;max-height:844px;overflow:hidden;border-radius:32px;background:#fff}
    .island{position:absolute;z-index:2;top:8px;left:50%;transform:translateX(-50%);width:90px;height:23px;border-radius:99px;background:#090909;pointer-events:none}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    @media(max-width:520px){body{padding:0;background:#fff}.toolbar{display:none}.device{width:100%!important;max-width:none;padding:0;border:0;border-radius:0;box-shadow:none}.screen{height:100vh;max-height:none;border-radius:0}.island{display:none}}
  </style>
</head>
<body>
  <div class="toolbar"><span><strong>手机端预览</strong> · 使用同一网站的响应式排版</span><div class="sizes" aria-label="选择预览宽度"><button type="button" data-width="390" class="active">390px</button><button type="button" data-width="430">430px</button></div></div>
  <div class="device" id="device"><div class="screen"><span class="island" aria-hidden="true"></span><iframe src="index.html" title="周思慧作品集手机端预览"></iframe></div></div>
  <script>
    const device=document.querySelector('#device');
    document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{
      document.querySelectorAll('[data-width]').forEach(item=>item.classList.toggle('active',item===button));
      device.style.width=`${Number(button.dataset.width)+24}px`;
    }));
  </script>
</body>
</html>
